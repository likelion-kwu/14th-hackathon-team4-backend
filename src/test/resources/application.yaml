spring:
  application:
    name: glucobite
  datasource:
    url: jdbc:h2:mem:glucobite;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

app:
  openai:
    api-key: test-openai-api-key
    model: gpt-5.6-luna
  jwt:
    secret: test-secret-key-that-is-at-least-thirty-two-bytes-long
    expiration: 1h
  cors:
    allowed-origins: https://allowed.example.com,http://localhost:5173
