spring:
  application:
    name: glucobite
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        # 배포 health check에 필요한 것만 연다.
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:1h}
  cors:
    # 기본값을 두지 않는다. 환경변수가 없으면 시작 시점에 실패해야 한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
