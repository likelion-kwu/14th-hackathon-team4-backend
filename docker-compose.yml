# EC2 서버에서 실행되는 구성.
# nginx(80/443) -> app(8080) -> db(3306)
# 컨테이너끼리는 같은 네트워크 안에서 "이름"으로 통신한다. (IP 대신 db, app)

services:
  db:
    image: mysql:8.0
    container_name: team4-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    # 외부에 3306을 열지 않는다. app 컨테이너만 내부 네트워크로 접근한다.
    expose:
      - "3306"
    networks:
      - team4-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    # CD에서 Docker Hub에 올린 이미지를 그대로 내려받아 쓴다.
    image: ${DOCKER_IMAGE}
    container_name: team4-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 호스트명이 곧 컨테이너 이름(db)이다.
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      # 서버 .env의 값을 컨테이너 안까지 전달한다. 이 줄이 없으면 앱이 시작되지 않는다.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      TZ: Asia/Seoul
    expose:
      - "8080"
    networks:
      - team4-net

  nginx:
    image: nginx:1.27-alpine
    container_name: team4-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # HTTPS 발급 후 아래 두 볼륨이 인증서를 물어온다. (README 참고)
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    networks:
      - team4-net

volumes:
  db-data:

networks:
  team4-net:
    driver: bridge
