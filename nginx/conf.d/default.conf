# 리버스 프록시: 클라이언트 요청을 가로채 뒤쪽 app 컨테이너로 넘긴다.
# 기본값은 HTTP(80)만 사용한다. 인증서 없이 바로 뜬다.
# 도메인 + HTTPS를 붙일 때 아래 "HTTPS" 블록 주석을 해제한다. (README 참고)

upstream app_upstream {
    # 컨테이너 이름으로 접근. 같은 도커 네트워크라 IP를 몰라도 된다.
    server app:8080;
}

server {
    listen 80;
    server_name _;

    # 업로드 용량 (파일 업로드 기능이 있으면 조정)
    client_max_body_size 20M;

    # Let's Encrypt 인증서 발급용 경로. HTTPS 붙일 때 사용한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# ------------------------------------------------------------------
